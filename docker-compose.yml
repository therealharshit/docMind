services:
  api:
    build: .
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: sqlite:///storage/app.db
      STORAGE_DIR: storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
